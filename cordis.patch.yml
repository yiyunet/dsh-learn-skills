# @yiyunet/dsh-learn-skills —— profile 组合层
#
# 本插件在**宿主平面**注册：
#   · 斜杠命令 /learn（ctx.commands）——与按钮走同一套流程
#   · HTTP RPC 端点 /api/dsh-learn-skills ——供输入区菜单调用
# 在**客户端平面**注册：
#   · conversation.input.left 槽位的一个 list 条目：[书本图标] AI学习 ▾
#
# 它不拥有任何模型工具：所有交互走宿主已有的 user-questions 与 commands 服务，
# 因此不需要在 agent preset 里加行（见 README「安装与装载」）。
- insert:
    - id: learn-skills
      name: '@yiyunet/dsh-learn-skills'
      config:
        # ── 默认作用范围 ────────────────────────────────────────────────────
        # 未显式给出工作区时，用当前会话绑定的工作区。设了这个值则**强制**用它，
        # 用于「把学习体系钉在某个固定目录」的部署。
        # workspaceRoot: 'D:/path/to/workspace'

        # ── 知识体系目录名（相对工作区根）──────────────────────────────────
        # 改这些值会让插件找不到既有知识库 —— 除非你确实换了布局，否则别动。
        index: index
        inbox: inbox
        knowledge: knowledge
        data: data
        task: task
        reports: reports
        skillsDir: .dsh/skills
        stateDir: .dsh/learn-skills

        # ── 预设 bundle 落点（相对工作区根）────────────────────────────────
        # ★ 2.1.0 起预设 bundle 落在**工作区内**（官方 editing-cordis-compositions
        #   技能的原话："Write a bundle directory in the workspace"）。
        #   好处：不进沙箱之外、不造"第三处全局落点"、工作区删除时连它一起走。
        #   ⚠️ 代价：该目录是**活的** —— 宿主重启时按预设 id 在当前配置里解析，
        #      目录被删/被移走 ⇒ 选中该预设的会话会被**拒绝恢复**。
        presetDir: .dsh/preset-bundles

        # 显式绝对路径覆盖（**老配置兼容**，非必要不要设）：设了就用它，
        # 不再随工作区走。2.0.0 及更早的默认落点是 <dshHome>/preset-bundles。
        # presetRoot: 'D:/path/to/preset-bundles'

        # ── 写门禁（默认全关：刻意的安全设计）──────────────────────────────
        # 四项功能里只有「初始预设」与「关联升级」会写文件，且**必须**
        # 由用户在界面上明确确认后才写。把下面的开关关掉即变为纯只读插件：
        #   初始预设 → 只展示画像摘要与拟创建路径，不落盘
        #   关联升级 → 只产出变更清单，不落盘
        allowWrite: true           # 总闸：关掉后一切写入（含预设创建）都被拒
        allowBehaviorRules: false  # 行为规则（预设提示词 / AGENTS.md / 技能）单独放行
                                   # 默认 false = 只允许改普通知识，规则类变更必须先由人打开此开关

        # ── 体检（沉淀复用）──────────────────────────────────────────────
        # 体检永远只读；保存基线只写 <stateDir>/audits/ 与 <reports>/。
        auditMaxFiles: 400         # 单次体检最多扫描的文件数（防大仓拖死）
        auditMaxBytes: 200000      # 单文件最多读取字节数（超出如实标注「未读全」）

        # ── 语义增强（方案 B-1：双轨并存 + 冲突标记）────────────────────────
        # ⚠️ 默认**关闭**，且这是刻意的：
        #   打开后，提炼会把**会话原文**发给模型做语义判定（类型 + 关系）。
        #   会话里可能有客户信息、平台账号线索、内部报价 —— 这是数据出站，
        #   属合规红线（须合规负责人裁断），故默认不启用。
        #   打开后的行为：模型给出「语义轨」建议，**与基线轨（正则/词面算法）并存**；
        #   两轨不一致 ⇒ 落盘标记冲突，由人在审核面板裁决 —— **绝不静默覆盖**。
        #   模型失败/超时/输出不合格 ⇒ 静默回退基线轨，流程一秒不停。
        allowModelSemantics: false

        # 语义增强批大小（一次调用处理多少条候选）；越大越省，但单次延迟越高。
        # semanticBatchSize: 8

        # 语义增强总预算（毫秒）：超预算即停止继续调用，剩余候选走基线轨，
        # 并在批次里如实标注「部分语义增强」。0 = 不限。
        # semanticBudgetMs: 60000

        # ── 会话范围 ──────────────────────────────────────────────────────
        # 提炼时的消息范围上限（当前上下文可见部分）。排除了本流程后来生成的问答。
        maxMessages: 400

        # ── 日志 ──────────────────────────────────────────────────────────
        verbose: false
